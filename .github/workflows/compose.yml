name: Compose build

# Proves the two-service stack (Jelu + Shelfmark) builds from a clean checkout.
# The Jelu image is built from source by the multi-stage Dockerfile, so this
# catches Dockerfile / compose regressions before anyone runs `docker compose up`.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".dockerignore"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/compose.yml"
  workflow_dispatch:

jobs:
  compose-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build Jelu image
        run: docker compose build jelu

      - name: Confirm the unpacked jar layout is present
        run: |
          docker run --rm --entrypoint sh jelu:local -c \
            'set -e; echo "--- /app ---"; ls /app; echo "--- /app/application ---"; ls /app/application | head -5; test -n "$(ls -A /app/application)"; test -f /app/org/springframework/boot/loader/launch/JarLauncher.class'

  compose-smoke:
    runs-on: ubuntu-latest
    needs: compose-build
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for both services to become healthy
        run: |
          for i in $(seq 1 60); do
            jelu_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' jelu 2>/dev/null || echo starting)
            shelf_health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' cwa-downloader 2>/dev/null || echo starting)
            echo "jelu=$jelu_health shelfmark=$shelf_health"
            if [ "$jelu_health" = "healthy" ] && [ "$shelf_health" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "stack did not become healthy" >&2
          docker compose logs --tail 80 >&2
          exit 1

      - name: Jelu serves the web UI
        run: curl -fsS -o /dev/null -w 'jelu %{http_code}\n' http://localhost:11111/

      - name: Bootstrap script seeds Shelfmark settings
        run: ./scripts/bootstrap-shelfmark.sh

      - name: Settings actually persisted in Shelfmark
        run: |
          curl -fsS http://localhost:8084/api/settings/mirrors \
            | grep -q 'annas-archive.gd'

      - name: Jelu can reach Shelfmark (status endpoint)
        run: curl -fsS -o /dev/null -w 'shelfmark %{http_code}\n' http://localhost:8084/api/status

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 120
