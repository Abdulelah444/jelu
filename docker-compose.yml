# Jelu + Shelfmark (Calibre-Web-Automated downloader) — the whole stack in one file.
#
#   cp .env.example .env
#   docker compose up -d --build
#   ./scripts/bootstrap-shelfmark.sh        # one-time: seed mirrors + DNS
#
#   - Jelu web UI      : http://localhost:11111
#   - Shelfmark web UI : http://localhost:8084  (you normally don't need it —
#     mirrors / DNS are managed from Jelu: Settings > Preferences > Downloads)
#
# Data lives under ./data/ by default (override with JELU_DATA_DIR).
# Set a SHELFMARK_API_KEY in .env to protect the Shelfmark API; Jelu picks it up
# automatically and uses it for the settings it pushes to Shelfmark.

name: jelu

services:
  jelu:
    build: .
    image: ${JELU_IMAGE:-jelu:local}
    container_name: jelu
    ports:
      - "11111:11111"
    volumes:
      - ${JELU_DATA_DIR:-./data}/config:/config
      - ${JELU_DATA_DIR:-./data}/database:/database
      - ${JELU_DATA_DIR:-./data}/images:/files/images
      - ${JELU_DATA_DIR:-./data}/imports:/files/imports
      - ${JELU_DATA_DIR:-./data}/ebooks:/files/ebooks
    environment:
      - JELU_DATABASE_PATH=/database/
      - JELU_FILES_IMAGES=/files/images/
      - JELU_FILES_IMPORTS=/files/imports/
      - JELU_EBOOKS_STORAGE_PATH=/files/ebooks
      - JELU_EBOOKS_DOWNLOADER_URL=http://cwa-downloader:8084
      # Optional: authenticate Jelu's pushes to Shelfmark with the same key
      # you set for the Shelfmark service. Leave unset when Shelfmark runs
      # without authentication (AUTH_METHOD=none).
      - JELU_EBOOKS_API_KEY=${SHELFMARK_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/11111' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      - cwa-downloader

  cwa-downloader:
    image: ghcr.io/calibrain/shelfmark:${SHELFMARK_TAG:-latest}
    container_name: cwa-downloader
    ports:
      - "8084:8084"
    volumes:
      - ${JELU_DATA_DIR:-./data}/cwa-config:/config
      - ${JELU_DATA_DIR:-./data}/ebooks:/books
    environment:
      # Optional: protects the Shelfmark API. If set, also set JELU_EBOOKS_API_KEY above.
      - SHELFMARK_API_KEY=${SHELFMARK_API_KEY:-}
      # Env-backed setting (Shelfmark's settings API cannot change it): keep at 1,
      # higher values make Shelfmark's internal Cloudflare bypass kill its own
      # sibling browser workers (upstream calibrain/shelfmark issue #1231).
      - MAX_CONCURRENT_DOWNLOADS=1
      - SUPPORTED_FORMATS=epub,pdf,mobi,azw3,cbz,cbr
      - BOOK_LANGUAGE=en,ar
    healthcheck:
      # Shelfmark's image is python-slim: no curl. Use urllib via python3 (or python).
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8084/api/health', timeout=4).status==200 else 1)\" || python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8084/api/health', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped
